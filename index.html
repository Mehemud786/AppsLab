<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppsLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #dc2626;
            /* Crimson/Red */
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        crimson: {
                            500: '#dc143c',
                            600: '#b01030',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-black text-white min-h-screen relative overflow-x-hidden flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8">
    
    <!-- Ambient Background Glow -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-lg h-[500px] bg-red-600/10 blur-[120px] rounded-full pointer-events-none z-0"></div>
    
    <main class="w-full max-w-2xl relative z-10 animate-fade-in">
        
        <!-- Profile Header -->
       <header class="flex flex-col items-center text-center mb-10">
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-4 text-white">Apps<span class="text-red-500 drop-shadow-[0_0_15px_rgba(220,38,38,0.8)]">Lab</span></h1>
        
        <!-- Stylish Welcome Text -->
        <div class="flex items-center justify-center gap-3 sm:gap-4 mt-2 mb-6 w-full">
            <!-- Left Fading Line -->
            <div class="h-[1px] w-8 sm:w-16 bg-gradient-to-r from-transparent to-neutral-500"></div>
            
            <!-- Styled Text -->
            <p class="uppercase tracking-[0.2em] text-[10px] sm:text-xs font-bold bg-gradient-to-r from-neutral-400 via-white to-neutral-400 bg-clip-text text-transparent whitespace-nowrap">
                Welcome to AppsLab 
            </p>
            
            <!-- Right Fading Line -->
            <div class="h-[1px] w-8 sm:w-16 bg-gradient-to-l from-transparent to-neutral-500"></div>
        </div>
    </header>
        <!-- Link Grid -->
        <div class="grid grid-cols-2 gap-3 sm:gap-5">
            
            <!-- Xfero Box -->
            <a href="https://xfero.vercel.app" target="_blank" rel="noopener noreferrer" class="group relative flex flex-col items-center text-center p-4 sm:p-6 bg-neutral-900/50 backdrop-blur-sm border border-neutral-800 rounded-2xl transition-all duration-300 hover:-translate-y-1 hover:scale-[1.02] hover:border-[#2F294B] hover:bg-neutral-900 hover:shadow-[0_0_25px_#0E1629]">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-[#0E1629] border border-[#2F294B] flex items-center justify-center mb-3 sm:mb-4 overflow-hidden transition-colors duration-300 group-hover:border-[#9A84F3] group-hover:bg-[#0E1629]">
                    <img src="/xfero-icon.jpg" alt="Xfero Icon" class="w-6 h-6 sm:w-7 sm:h-7 object-contain transition-transform duration-300 group-hover:scale-110">
                </div>
                <h2 class="text-base sm:text-lg font-semibold text-white group-hover:text-[#9A84F3] transition-colors">Xfero</h2>
                <p class="text-xs sm:text-sm text-neutral-500 mt-1 sm:mt-2">P2P file sharing</p>
            </a>
            
            <!-- CyberQR Box -->
            <a href="https://cyberqr.vercel.app" target="_blank" rel="noopener noreferrer" class="group relative flex flex-col items-center text-center p-4 sm:p-6 bg-neutral-900/50 backdrop-blur-sm border border-neutral-800 rounded-2xl transition-all duration-300 hover:-translate-y-1 hover:scale-[1.02] hover:border-[#004E53] hover:bg-neutral-900 hover:shadow-[0_0_25px_#002A2D]">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-[#030E22] border border-[#004E53] flex items-center justify-center mb-3 sm:mb-4 overflow-hidden transition-colors duration-300 group-hover:border-[#00EDFD] group-hover:bg-[#030E22]">
                    <img src="/cyberQR-icon.png" alt="CyberQR Icon" class="w-6 h-6 sm:w-7 sm:h-7 object-contain transition-transform duration-300 group-hover:scale-110">
                </div>
                <h2 class="text-base sm:text-lg font-semibold text-white group-hover:text-[#00EDFD] transition-colors">CyberQR</h2>
                <p class="text-xs sm:text-sm text-neutral-500 mt-1 sm:mt-2">QR scanner</p>
            </a>
            
        </div>
        
        <!-- Footer -->
        
    </main>
</body>

</html>
